name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The dependency-free core + sample loader. Fast, no system libraries — this
  # is the gate for the fully-validated DSP (the bulk of the test suite).
  core:
    name: Core (dsp + loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test -p mangle-dsp -p mangle-loader
      - name: Clippy
        run: cargo clippy -p mangle-dsp -p mangle-loader --all-targets -- -D warnings

  # The nih-plug CLAP shell + egui editor. Needs baseview/egui system deps;
  # builds the bundle via the documented `cargo xtask` path.
  plugin:
    name: Plugin (CLAP shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install baseview / egui system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgl-dev libjack-jackd2-dev libx11-xcb-dev \
            libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev g++
      - name: Clippy
        run: cargo clippy -p mangle --all-targets -- -D warnings
      - name: Test
        run: cargo test -p mangle
      - name: Bundle + headless CLAP smoketest
        run: bash tools/run-smoketest.sh --release
